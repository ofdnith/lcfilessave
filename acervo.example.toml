# Configuração do Acervo.
# Copie para acervo.toml e ajuste. O acervo.toml não vai para o Git.
# Caminhos relativos são contados a partir da pasta deste arquivo.
# No Realme, o instalar.sh cria o acervo.toml sozinho.

# Onde ficam os arquivos e o catálogo.
data_dir = "dev-dados"

# Endereço e porta. "127.0.0.1" = só este computador.
# "0.0.0.0" = rede local e Tailscale; exige senha (acervo senha).
host = "127.0.0.1"
port = 8765

# Nome mostrado na interface.
server_name = "Acervo (Mac)"

# HTTPS próprio (necessário para o web app no iPhone).
# 1) liste os endereços pelos quais o servidor é acessado; 2) rode: acervo certificado
https = false
# tls_names = ["192.168.0.50", "realme.tail1234.ts.net"]

# Alerta quando o disco passar desta porcentagem.
storage_alert_pct = 80

# Tamanho de um lote para transferir a um HD, em GB.
archive_batch_gb = 80

# Em quantos HDs cada arquivo precisa estar (verificado) antes de sair do servidor.
# 1 = um HD; 2 = dois HDs (espelho, recomendado para não depender de um disco só).
archive_copies = 1

# Dias na lixeira antes de apagar de vez (mínimo 30).
trash_days = 30

# Tamanho máximo da Entrada (aguardando triagem), em GB. 0 = sem limite.
# Passou disso, o servidor recusa novos envios até a triagem liberar espaço.
inbox_max_gb = 100

# As tarefas de fundo (miniaturas, OCR…) pausam com a bateria nesta temperatura
# e voltam 3 °C abaixo. O celular vive na tomada; isso poupa a bateria.
max_temp_c = 40

# Cartão microSD (Realme): veja docs/realme.md.
# sd_dir = "/storage/XXXX-XXXX/Android/data/com.termux/files/acervo"
# true = tudo o que passa pela triagem vai para o cartão (cópia conferida por
# SHA-256); a memória interna fica só com a Entrada. Do cartão, os lotes vão
# para o HD. false = o cartão só recebe quando a memória interna passa do alerta.
# sd_for_library = true

# Cópia diária do catálogo (as 7 mais recentes ficam).
# catalog_backup_dir = "copias-do-catalogo"

# Fora de casa (pedidos que chegam pelo Tailscale):
#   "seguro"   = ver, buscar, enviar, manter e álbuns; nada de apagar nem mexer em HDs
#   "completo" = tudo liberado
remote_mode = "seguro"

# Links do iCloud dos atalhos prontos (aparecem em Ajustes → Configurar iPhone).
# shortcut_manual_url = "https://www.icloud.com/shortcuts/…"
# shortcut_daily_url = "https://www.icloud.com/shortcuts/…"

# Contato que acompanha os avisos (exigência do serviço da Apple).
# push_contact = "mailto:voce@exemplo.com"
