# Configuração do Acervo.
# Copie para acervo.toml e ajuste. O acervo.toml não vai para o Git.
# Caminhos relativos são contados a partir da pasta deste arquivo.
# No Realme, o instalar.sh cria o acervo.toml sozinho.

# Onde ficam os arquivos e o catálogo.
data_dir = "dev-dados"

# Endereço e porta. "127.0.0.1" = só este computador.
# "0.0.0.0" = rede local e Tailscale; exige senha (acervo senha).
host = "127.0.0.1"
port = 8765

# Nome mostrado na interface.
server_name = "Acervo (Mac)"

# HTTPS (necessário para o web app no iPhone). Com https = true:
# - endereço seguro, recomendado: rode  acervo duckdns  (DuckDNS + Let's Encrypt; os IPs
#   do Wi-Fi e do Tailscale são descobertos sozinhos, nada a instalar nos aparelhos);
# - certificado próprio, de reserva: rode  acervo certificado  (já inclui os IPs atuais;
#   tls_names acrescenta outros nomes).
https = false
# tls_names = ["192.168.0.50"]
# Onde fica o acme.sh (instalado pelo instalar.sh).
# acme_home = "~/.acme.sh"

# Alerta quando o disco passar desta porcentagem.
storage_alert_pct = 80

# Tamanho de um lote para transferir a um armazenamento (HD, SSD, pendrive…), em GB.
archive_batch_gb = 5

# Em quantos armazenamentos cada arquivo precisa estar (verificado) antes de sair do servidor.
# 1 = um; 2 = dois (espelho, recomendado para não depender de um disco só).
archive_copies = 1

# Dias na lixeira antes de apagar de vez (mínimo 30).
trash_days = 30

# Tamanho máximo da Entrada (aguardando triagem), em GB. 0 = sem limite (os
# envios só param quando o disco acabar). Com limite, passou disso o servidor
# recusa novos envios até a triagem liberar espaço.
inbox_max_gb = 0

# Lembrete de triagem: avisa quando algo está na Entrada há mais destes dias
# ou quando ela passa destes GB (o que está na Entrada só existe no celular).
# 0 desliga cada um.
inbox_alert_days = 7
inbox_alert_gb = 5

# As tarefas de fundo (miniaturas, OCR…) pausam com a bateria nesta temperatura
# e voltam 3 °C abaixo. O celular vive na tomada; isso poupa a bateria.
max_temp_c = 40

# Lembrete de lote: avisa quando algo mantido no Acervo está só no servidor há
# mais destes dias (além de quando o lote chega a archive_batch_gb). 0 desliga.
archive_alert_days = 14

# Cartão microSD: aposentado em 01/11/2026 (nada novo vai para ele). Se o seu
# acervo.toml ainda tem sd_dir, deixe o cartão no celular até o que estava lá
# voltar sozinho para a memória interna; depois pode apagar a linha.
# sd_dir = "/storage/XXXX-XXXX/Android/data/com.termux/files/acervo"

# Cópia diária do catálogo (as 7 mais recentes ficam).
# catalog_backup_dir = "copias-do-catalogo"

# Fora de casa (pelo Tailscale) tudo funciona igual a dentro de casa, sempre com senha.

# Links do iCloud dos atalhos prontos (aparecem em Ajustes → Configurar iPhone).
# shortcut_manual_url = "https://www.icloud.com/shortcuts/…"
# shortcut_daily_url = "https://www.icloud.com/shortcuts/…"

# Contato que acompanha os avisos (exigência do serviço da Apple).
# push_contact = "mailto:voce@exemplo.com"
