[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acervo"
version = "0.0.1"
description = "Acervo — estação pessoal de triagem e backup de fotos, vídeos e documentos."
requires-python = ">=3.11"
# Keep this list small: every dependency must install on Termux (Android ARM64).
# uvicorn without [standard]: uvloop/httptools need a compiler; plain h11 is enough.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
acervo = "acervo.__main__:main"

[tool.setuptools.packages.find]
include = ["acervo*"]

[tool.setuptools.package-data]
acervo = ["migrations/*.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
