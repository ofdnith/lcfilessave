# Builds the desktop app (Tauri, in mac/) for macOS and Windows.
#
# - Pushes to main and pull requests that touch the app, and manual runs: build both,
#   keep the installers as run artifacts (30 days).
# - A release tag "vX.Y.Z" (same version as mac/src-tauri/tauri.conf.json, the server
#   and the web app; see CHANGELOG.md): build both and publish them on the GitHub
#   Releases page. Old-style "app-vX.Y.Z" tags still work.
#
# The apps are not signed with paid certificates: macOS gets an ad-hoc signature
# ("Abrir Mesmo Assim" in Privacidade e Segurança the first time) and Windows shows the
# SmartScreen notice ("Mais informações › Executar assim mesmo"). See mac/README.md.
name: App (Mac e Windows)

on:
  push:
    branches: [main]
    tags: ["v*", "app-v*"]
    paths:
      - "mac/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "mac/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Intel e Apple Silicon)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: Acervo-macOS
            paths: mac/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            rust_targets: ""
            args: --bundles nsis
            artifact: Acervo-Windows
            paths: mac/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mac/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac/src-tauri -> target

      - name: Dependências
        working-directory: mac
        run: npm ci --no-audit --no-fund

      # On Windows the test executables are only built, not run: Tauri attaches the
      # Common Controls v6 manifest to the app binary only, so a test exe that links the
      # dialog plugin cannot even start there. The same tests run for real on macOS.
      - name: Testes do app
        if: runner.os == 'macOS'
        working-directory: mac/src-tauri
        run: cargo test

      - name: Testes do app (só compilar)
        if: runner.os == 'Windows'
        working-directory: mac/src-tauri
        run: cargo test --no-run

      - name: Compilar e (em tag) publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: mac
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Acervo ${{ github.ref_name }}"
          releaseBody: |
            O que mudou: veja o `CHANGELOG.md`.

            **Servidor (Realme):** no Termux, rode `acervo-ctl atualizar` (os dados ficam).

            **Mac:** baixe o `.dmg`, abra e arraste o Acervo para Aplicativos. Na primeira vez,
            Ajustes do Sistema › Privacidade e Segurança › **Abrir Mesmo Assim**.

            **Windows:** baixe o `-setup.exe` e instale. Se aparecer "O Windows protegeu o computador",
            clique em **Mais informações › Executar assim mesmo**.

            Passo a passo completo em `mac/README.md`.
          releaseDraft: false
          prerelease: false

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 30
